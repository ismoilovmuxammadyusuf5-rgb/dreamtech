<section id="drawPanel"><div class="card"><b>6 ta ko‘rinish</b><div class="grid" id="views"></div></div><div class="card"><b>✏️ Chizma</b><div class="drawbox"><canvas id="draw"></canvas></div><div class="row" style="margin-top:6px"><button class="btn" id="erase">🧽 O‘chirish</button><button class="btn" id="clear">🗑 Tozalash</button></div></div><div class="card"><b>📐 O‘lchamlar (sm)</b><div class="row"><div><label>Uzunlik</label><input id="L" type="number" value="450"></div><div><label>Kenglik</label><input id="W" type="number" value="185"></div><div><label>Balandlik</label><input id="H" type="number" value="140"></div></div></div><button class="btn primary" id="generate" style="width:100%">🧊 3D MODELNI YARATISH</button><button class="btn" id="sample" style="width:100%;margin-top:6px">✨ Namuna chizmasini yuklash</button></section>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const $=id=>document.getElementById(id);let currentView=0,drawing=false,erasing=false,selected=null,drag=null,cam={x:.15,y:.2},dist=10;const viewNames=['OLDI','ORQA','CHAP','O‘NG','TEPA','PAST'];
viewNames.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{currentView=i;document.querySelectorAll('#views button').forEach((x,j)=>x.classList.toggle('active',j===i));loadCanvas()};$('views').appendChild(b)});$('views').firstChild.classList.add('active');
const cvs=$('draw'),ctx=cvs.getContext('2d');let strokes=Array.from({length:6},()=>[]);function sizeDraw(){const r=cvs.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=r.width*d;cvs.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);loadCanvas()}function loadCanvas(){const r=cvs.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineCap='round';for(const s of strokes[currentView]){ctx.beginPath();s.forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}}function pt(e){const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cvs.onpointerdown=e=>{drawing=true;const p=pt(e);strokes[currentView].push([p])};cvs.onpointermove=e=>{if(!drawing)return;const p=pt(e);if(erasing){const ss=strokes[currentView];let best=-1,bd=28;ss.forEach((s,i)=>s.forEach(q=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=i}}));if(best>=0)ss.splice(best,1);loadCanvas();}else{let s=strokes[currentView][strokes[currentView].length-1];s.push(p);loadCanvas()}};cvs.onpointerup=()=>drawing=false;cvs.onpointercancel=()=>drawing=false;$('erase').onclick=()=>{erasing=!erasing;$('erase').textContent=erasing?'✏️ Chizish':'🧽 O‘chirish'};$('clear').onclick=()=>{strokes[currentView]=[];loadCanvas()};addEventListener('resize',sizeDraw);setTimeout(sizeDraw,100);
const canvas=$('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x040a12);const camera=new THREE.PerspectiveCamera(45,1,.1,100);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));scene.add(new THREE.HemisphereLight(0xcfe8ff,0x111111,2));let dl=new THREE.DirectionalLight(0xffffff,2.3);dl.position.set(6,9,6);scene.add(dl);scene.add(new THREE.GridHelper(18,18));const root=new THREE.Group();scene.add(root);let meshes=[];const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.15})}function add(n,g,c,p){let m=new THREE.Mesh(g,mat(c));m.name=n;m.position.set(...p);root.add(m);meshes.push(m);return m}function contourBox(idx){
 const ss=strokes[idx]||[]; const pts=ss.flat();
 if(!pts.length) return null;
 let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
 pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
 return {w:Math.max(8,maxX-minX),h:Math.max(8,maxY-minY)};
}
function build(){
 root.clear();meshes=[];
 const L=Math.max(1,+$('L').value/80),W=Math.max(1,+$('W').value/80),H=Math.max(.7,+$('H').value/80);
 const front=contourBox(0), rear=contourBox(1), side=contourBox(2)||contourBox(3), top=contourBox(4);
 // User sketches affect proportions. We normalize each silhouette so a hand-drawn wide/tall contour changes the generated body.
 const sideRatio=side?Math.min(1.8,Math.max(.45,side.h/side.w*2.0)):1;
 const topRatio=top?Math.min(1.25,Math.max(.65,top.h/top.w*1.15)):1;
 const endRatio=front?Math.min(1.2,Math.max(.72,front.w/Math.max(front.h,1))):1;
 const bodyH=H*.48*sideRatio, bodyW=W*topRatio, endW=bodyW*Math.min(1,endRatio);
 const frontRatio=front?Math.min(1.18,Math.max(.72,front.w/Math.max(front.h,1))):1; const rearRatio=rear?Math.min(1.18,Math.max(.72,rear.w/Math.max(rear.h,1))):1; const endScale=(frontRatio+rearRatio)/2; const body=add('Kuzov',new THREE.BoxGeometry(L,bodyH,bodyW),0x1677b8,[0,H*.52,0]);
 // Make the cabin taper and rise according to the side sketch.
 const cabL=L*(side?Math.min(.62,Math.max(.32,side.w/Math.max(1,side.h)*.9)):.48);
 const cabH=H*.42*sideRatio;
 add('Kabina',new THREE.BoxGeometry(cabL,cabH,bodyW*.82),0x24506d,[-.03,H*.52+bodyH*.5+cabH*.48,0]);
 add('Kapot',new THREE.BoxGeometry(L*.25,H*.15,bodyW*.92),0x2088c8,[L*.29,H*.52+bodyH*.53,0]);
 add('Bagaj',new THREE.BoxGeometry(L*.19,H*.15,bodyW*.92),0x2088c8,[-L*.35,H*.52+bodyH*.52,0]);
 add('Spoiler',new THREE.BoxGeometry(L*.21,.09,bodyW*.94),0x11151c,[-L*.42,H*1.12,0]);
 const wheelR=Math.max(.13,H*.19);
 for(const x of [-L*.30,L*.30])for(const z of [-bodyW*.53,bodyW*.53]){let w=add('G‘ildirak',new THREE.CylinderGeometry(wheelR,wheelR,H*.10,32),0x151a20,[x,wheelR,z]);w.rotation.z=Math.PI/2}
 for(const z of [-bodyW*.41,bodyW*.41])add('Oyna',new THREE.BoxGeometry(L*.28,H*.23,.06),0x78cbe8,[-.02,H*.52+bodyH*.68,z]);
 // Front/rear sketches influence the end face width using subtle scale.
 body.scale.z=(endW/bodyW)*endScale;
 renderParts();select(body); $('status').textContent=(front||rear||side||top)?'6 ko‘rinish konturlari hisobga olindi.':'Namuna geometriya yaratildi.';
}
function renderParts(){let e=$('parts');e.innerHTML='';meshes.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m.name;b.onclick=()=>select(m);e.appendChild(b)})}function select(m){selected=m;$('sel').textContent=m.name;document.querySelectorAll('#parts button').forEach((b,i)=>b.classList.toggle('active',meshes[i]===m));sync()}function sync(){if(!selected)return;[['px',selected.position.x],['py',selected.position.y],['pz',selected.position.z],['rx',THREE.MathUtils.radToDeg(selected.rotation.x)],['ry',THREE.MathUtils.radToDeg(selected.rotation.y)],['rz',THREE.MathUtils.radToDeg(selected.rotation.z)],['sx',selected.scale.x],['sy',selected.scale.y],['sz',selected.scale.z]].forEach(([i,v])=>$(i).value=v.toFixed(2))}function bind(ids,prop,fn){ids.forEach(([id,a])=>$(id).oninput=e=>{if(selected)selected[prop][a]=fn(+e.target.value)})}bind([['px','x'],['py','y'],['pz','z']],'position',v=>v);bind([['rx','x'],['ry','y'],['rz','z']],'rotation',v=>THREE.MathUtils.degToRad(v));bind([['sx','x'],['sy','y'],['sz','z']],'scale',v=>Math.max(.05,v));
function resize(){let r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function camUpdate(){camera.position.set(Math.sin(cam.y)*dist,3+Math.sin(cam.x)*dist*.35,Math.cos(cam.y)*dist);camera.lookAt(0,1.2,0)}camUpdate();function hit(e){let r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pointer,camera);return ray.intersectObjects(meshes,false)[0]?.object}canvas.onpointerdown=e=>{let h=hit(e);if(h){select(h);drag={o:h,x:e.clientX,y:e.clientY}}else drag={c:1,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.o){drag.o.position.x+=dx*.012;drag.o.position.z+=dy*.012;sync()}else{cam.y-=dx*.008;cam.x=Math.max(-.7,Math.min(.7,cam.x+dy*.006));camUpdate()}};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{dist=Math.max(4,Math.min(18,dist+e.deltaY*.01));camUpdate()};
function ai(){let t=$('ai').value.toLowerCase(); if(!selected)return; let m=t.match(/(\d+(?:\.\d+)?)\s*sm/); if((t.includes('mashina')||t.includes('kuzov'))&&m){ const d=+m[1]/80; if(t.includes('past')) root.position.y-=d; else if(t.includes('yuqori')||t.includes('baland')) root.position.y+=d; else if(t.includes('uzun')) root.scale.x*=1+d/Math.max(1,+$('L').value/80); else if(t.includes('keng')) root.scale.z*=1+d/Math.max(1,+$('W').value/80); } else { if(t.includes('past')||t.includes('lower'))selected.scale.y*=.9; if(t.includes('baland'))selected.scale.y*=1.1; if(m&&t.includes('past'))selected.position.y-=+m[1]/80; if(m&&t.includes('yuqori'))selected.position.y+=+m[1]/80; } sync(); $('status').textContent='AI buyrug‘i bajarildi: '+$('ai').value} $('ask').onclick=ai;
function data(){return {strokes,L:$('L').value,W:$('W').value,H:$('H').value,parts:meshes.map(m=>({n:m.name,p:m.position.toArray(),r:[m.rotation.x,m.rotation.y,m.rotation.z],s:m.scale.toArray()}))}}$('save').onclick=()=>{localStorage.setItem('dreamtech_final',JSON.stringify(data()));$('status').textContent='Loyiha saqlandi.'};$('load').onclick=()=>{let d=JSON.parse(localStorage.getItem('dreamtech_final')||'null');if(!d)return;$('L').value=d.L;$('W').value=d.W;$('H').value=d.H;strokes=d.strokes;loadCanvas();build();(d.parts||[]).forEach((x,i)=>{if(meshes[i]){meshes[i].position.fromArray(x.p);meshes[i].rotation.set(...x.r);meshes[i].scale.fromArray(x.s)}});sync();$('status').textContent='Loyiha yuklandi.'};
$('sample').onclick=()=>{strokes=Array.from({length:6},()=>[]); const shapes=[{x:55,y:80,w:210,h:65},{x:55,y:80,w:210,h:65},{x:30,y:60,w:260,h:85},{x:30,y:60,w:260,h:85},{x:50,y:60,w:220,h:85},{x:50,y:60,w:220,h:85}]; shapes.forEach((q,i)=>{strokes[i]=[[{x:q.x,y:q.y},{x:q.x+q.w,y:q.y},{x:q.x+q.w,y:q.y+q.h},{x:q.x,y:q.y+q.h},{x:q.x,y:q.y}]]});loadCanvas();$('status').textContent='Namuna chizmasi yuklandi.'};$('generate').onclick=()=>{build();document.querySelector('[data-tab=model]').click()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('drawPanel').style.display=b.dataset.tab==='draw'?'block':'none';$('modelPanel').style.display=b.dataset.tab==='model'?'block':'none';$('airPanel').style.display=b.dataset.tab==='air'?'block':'none'});
$('obj').onclick=()=>{root.updateMatrixWorld(true);let out='# DreamTech Final MVP\n',off=1;meshes.forEach(m=>{let p=m.geometry.attributes.position;for(let i=0;i<p.count;i++){let v=new THREE.Vector3().fromBufferAttribute(p,i).applyMatrix4(m.matrixWorld);out+=`v ${v.x} ${v.y} ${v.z}\n`}let a=m.geometry.index?.array;if(a){for(let i=0;i<a.length;i+=3)out+=`f ${a[i]+off} ${a[i+1]+off} ${a[i+2]+off}\n`;}else{for(let i=0;i<p.count;i+=3)out+=`f ${i+off} ${i+1+off} ${i+2+off}\n`;}off+=p.count});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain'}));a.download='DreamTech_Final.obj';a.click()};build();function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();
